<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Management System</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f6f3ee; color: #3b2f25; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .b { text-align: center; max-width: 380px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; } p { color: #7a6a5b; line-height: 1.5; margin: 0 0 18px; }
  button { background: #7a4a21; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
</style></head>
<body><div class="b"><h1>Không kết nối được hệ thống</h1>
<p>Hãy kiểm tra mạng Internet của bạn rồi thử lại. Ứng dụng sẽ tự thử lại sau ít giây.</p>
<button onclick="location.href='app://retry'">Thử lại</button></div>
<script>setTimeout(function () { location.href = 'app://retry'; }, 8000);</script></body></html>
